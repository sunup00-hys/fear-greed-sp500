name: Update actual weekly market data
on:
  push:
    branches: [main]
    paths: ['scripts/update_data.py', '.github/workflows/update-data.yml']
  workflow_dispatch:
  schedule:
    - cron: '10 23 * * 0'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch real daily data and calculate weekly means
        run: python scripts/update_data.py
      - name: Commit updated observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update verified weekly market observations"
            git push
          fi
